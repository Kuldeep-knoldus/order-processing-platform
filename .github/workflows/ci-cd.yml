name: CI-CD

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B verify
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  scan-and-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Azure OIDC configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=()
          [ -n "$AZURE_CLIENT_ID" ] || missing+=(AZURE_CLIENT_ID)
          [ -n "$AZURE_TENANT_ID" ] || missing+=(AZURE_TENANT_ID)
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=(AZURE_SUBSCRIPTION_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
      - uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${REGISTRY%%.*}"
      - name: Build and scan images
        run: |
          for service in order-api order-processor notification-service; do
            docker build -f services/$service/Dockerfile -t "$REGISTRY/$service:$IMAGE_TAG" .
            docker run --rm aquasec/trivy:0.56.2 image --exit-code 1 --severity HIGH,CRITICAL "$REGISTRY/$service:$IMAGE_TAG"
            docker push "$REGISTRY/$service:$IMAGE_TAG"
          done

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: scan-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
      - uses: azure/setup-helm@v4
      - run: helm upgrade --install order-platform helm/order-platform --set image.registry="$REGISTRY" --set image.tag="$IMAGE_TAG" --wait --timeout 5m
      - run: kubectl rollout status deployment/order-api --timeout=120s