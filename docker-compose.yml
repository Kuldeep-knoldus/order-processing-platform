services:
  order-api:
    build:
      context: .
      dockerfile: services/order-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  order-processor:
    build:
      context: .
      dockerfile: services/order-processor/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10